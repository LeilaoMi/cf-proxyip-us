name: CI
# PR 与 main 上验证主流程用到的环境：Python 测试 + 按 package-lock 安装 wrangler 并 dry-run 打包 Worker。
# 不需要任何 secret，不碰线上。Dependabot 的 npm / actions 升级 PR 也会经过这里。
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 22.12.0 = package.json engines 下限；24 = 生产 workflow 实际使用的版本
        node: ["22.12.0", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Syntax check
        run: |
          python3 -m py_compile build_dataset.py scripts/*.py
          node --check worker.js

      - name: Unit tests
        run: python3 -m unittest discover -s tests

      - name: Install Wrangler (pinned in package-lock.json)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Wrangler dry-run build
        run: npx --no-install wrangler deploy --dry-run --outdir "$RUNNER_TEMP/wrangler-dry-run"
