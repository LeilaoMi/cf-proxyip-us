# 自动维护 ProxyIP 数据：生成数据 -> 校验 -> 同步 KV -> 同步 DNS -> 部署 Worker
name: ProxyIP Auto Update

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

concurrency:
  group: proxyip-auto-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Account ID 不是密钥；API Token 必须只放在 GitHub Secret 中。
      CLOUDFLARE_ACCOUNT_ID: 7a008dc2b0c06b522b5a1aed2b628755
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROXYIP_HMAC_SECRET: ${{ secrets.PROXYIP_HMAC_SECRET }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 # zizmor: ignore[artipacked] 该任务需要推送提交
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install -g wrangler@4

      - name: Syntax check
        run: |
          python3 -m py_compile build_dataset.py scripts/*.py
          node --check worker.js

      - name: Generate, validate, and test outputs
        env:
          # 表达式放环境变量、不直接插进 shell：值经 ${{ }} 传入环境是数据不是脚本，
          # 再以 CHECK_APIS="$CHECK_APIS_VALUE" 只赋给 build_dataset.py 这一行；
          # 既防 $(...) 注入，测试步骤也不继承 CHECK_APIS。
          CHECK_APIS_VALUE: ${{ vars.CHECK_APIS != '' && vars.CHECK_APIS || 'https://check.proxyip.cmliussss.net/check,https://api.check.proxyip.cmliussss.net/check' }}
        run: |
          CHECK_APIS="$CHECK_APIS_VALUE" python3 build_dataset.py
          python3 scripts/validate_outputs.py
          python3 -m unittest discover -s tests

      - name: Run ProxyIP auto update
        # 执行 scripts/auto_update.py：同步 KV、DNS、部署 Worker，并验证线上接口。
        env:
          PROXYIP_SKIP_GENERATE: "1"
        run: python3 scripts/auto_update.py