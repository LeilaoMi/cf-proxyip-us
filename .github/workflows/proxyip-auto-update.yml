# 自动维护 ProxyIP 数据：生成数据 -> 校验 -> 同步 KV -> 同步 DNS -> 部署 Worker
name: ProxyIP Auto Update

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

concurrency:
  group: proxyip-auto-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Account ID 不是密钥；API Token 必须只放在 GitHub Secret 中。
      CLOUDFLARE_ACCOUNT_ID: 7a008dc2b0c06b522b5a1aed2b628755
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROXYIP_HMAC_SECRET: ${{ secrets.PROXYIP_HMAC_SECRET }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install -g wrangler@4

      - name: Syntax check
        run: |
          python3 -m py_compile build_dataset.py scripts/*.py
          node --check worker.js

      - name: Generate, validate, and test outputs
        run: |
          # CHECK_APIS 只给 build_dataset.py：仓库变量（Settings -> Variables，逗号分隔），
          # 设了就用自有检测地址，未设置时回落到 cmliu 默认；测试步骤不继承该变量，
          # 否则 tests/test_checker_failover.py 对默认地址的断言会失败。
          CHECK_APIS="${{ vars.CHECK_APIS != '' && vars.CHECK_APIS || 'https://check.proxyip.cmliussss.net/check,https://api.check.proxyip.cmliussss.net/check' }}" python3 build_dataset.py
          python3 scripts/validate_outputs.py
          python3 -m unittest discover -s tests

      - name: Run ProxyIP auto update
        # 执行 scripts/auto_update.py：同步 KV、DNS、部署 Worker，并验证线上接口。
        env:
          PROXYIP_SKIP_GENERATE: "1"
        run: python3 scripts/auto_update.py